# 澳门绿色通关与碳足迹评估系统 · 配置
# 注意：本文件含密钥，已在 .gitignore 中排除，禁止提交

project:
  name: "macau_eco_travel"
  schema_version: "v0.1.0"

database:
  path: "./data/macau.sqlite"     # 相对 macau_eco_travel/ 根目录；绝不指向 ccus.sqlite
  backups_dir: "./data/backups"

knowledge:
  dir: "./knowledge"              # RAG 语料：*.txt 会被自动加载
  rules_file: "./knowledge/customs_rules.txt"
  factors_file: "./knowledge/carbon_factors.txt"

deepseek:
  api_key: "REPLACE_WITH_YOUR_DEEPSEEK_API_KEY"   # ← 填真实 key（sk-开头）
  base_url: "https://api.deepseek.com"
  model: "deepseek-chat"          # 可选 deepseek-reasoner
  temperature: 0.2
  max_tokens: 1200
  timeout_seconds: 60

logging:
  dir: "./logs"
  save_llm_raw: true              # 原始返回写入 search_logs.llm_raw_response
